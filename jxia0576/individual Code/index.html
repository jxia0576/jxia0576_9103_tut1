<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadway Boogie Woogie In Motion</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin: 10px 0;
      color: #333;
    }
    #canvas-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin: 20px 0;
    }
    button {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      transform: scale(1.05);
    }
    .day-mode {
      background-color: #1a237e;
      color: white;
    }
    .night-mode {
      background-color: #ffca2b;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Broadway Boogie Woogie In Motion</h1>
  
  <div id="canvas-container"></div>
  
  <button id="mode-btn" class="day-mode" onclick="toggleMode()">🌙 Night Mode</button>
  
  <p style="color: #999; margin-top: 20px; text-align: center; max-width: 400px;">
    Watch the traffic flow through the grid of New York City streets!
  </p>

  <script src="sketch.js"></script>
</body>
</html>
